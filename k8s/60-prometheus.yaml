apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pgcache-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: app-baseline
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["app-baseline:8080"]

      - job_name: app-cached
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["app-cached:8080"]

      - job_name: pgcache
        metrics_path: /metrics
        static_configs:
          - targets: ["pgcache:9090"]

      - job_name: postgres-exporter
        static_configs:
          - targets: ["postgres-exporter:9187"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pgcache-demo
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pgcache-demo
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30091