apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: pgcache-demo
data:
  init.sql: |
    -- Schema
    CREATE EXTENSION IF NOT EXISTS pg_trgm;

    CREATE TABLE categories (
        id BIGSERIAL PRIMARY KEY,
        name TEXT NOT NULL
    );

    CREATE TABLE products (
        id BIGSERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT,
        category_id BIGINT NOT NULL REFERENCES categories(id),
        price NUMERIC(10, 2) NOT NULL,
        stock INT NOT NULL DEFAULT 0,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX idx_products_category ON products (category_id);
    CREATE INDEX idx_products_name_trgm ON products USING gin (name gin_trgm_ops);

    CREATE TABLE customers (
        id BIGSERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        email TEXT NOT NULL UNIQUE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE orders (
        id BIGSERIAL PRIMARY KEY,
        customer_id BIGINT NOT NULL REFERENCES customers(id),
        status TEXT NOT NULL DEFAULT 'completed',
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX idx_orders_customer ON orders (customer_id);

    CREATE TABLE order_items (
        id BIGSERIAL PRIMARY KEY,
        order_id BIGINT NOT NULL REFERENCES orders(id),
        product_id BIGINT NOT NULL REFERENCES products(id),
        quantity INT NOT NULL,
        unit_price NUMERIC(10, 2) NOT NULL
    );
    CREATE INDEX idx_order_items_order ON order_items (order_id);
    CREATE INDEX idx_order_items_product ON order_items (product_id);

    -- Seed: categories
    INSERT INTO categories (name)
    SELECT unnest(ARRAY[
        'Footwear', 'Outerwear', 'Accessories', 'Activewear', 'Formalwear',
        'Knitwear', 'Denim', 'Swimwear', 'Underwear', 'Kidswear'
    ]);

    -- Seed: products (~50,000)
    INSERT INTO products (name, description, category_id, price, stock, created_at)
    SELECT
        'Product ' || g,
        'Description for product ' || g,
        (SELECT id FROM categories ORDER BY random() LIMIT 1),
        round((random() * 190 + 10)::numeric, 2),
        (random() * 500)::int,
        now() - (random() * interval '365 days')
    FROM generate_series(1, 50000) AS g;

    -- Seed: customers (~5,000)
    INSERT INTO customers (name, email, created_at)
    SELECT
        'Customer ' || g,
        'customer' || g || '@example.com',
        now() - (random() * interval '365 days')
    FROM generate_series(1, 5000) AS g;

    -- Seed: orders (~200,000)
    INSERT INTO orders (customer_id, status, created_at)
    SELECT
        (floor(random() * 5000) + 1)::bigint,
        (ARRAY['completed', 'completed', 'completed', 'cancelled', 'pending'])[floor(random() * 5) + 1],
        now() - (random() * interval '365 days')
    FROM generate_series(1, 200000) AS g;

    -- Seed: order_items (~1-3 items per order, ~400,000 rows)
    INSERT INTO order_items (order_id, product_id, quantity, unit_price)
    SELECT
        o.id,
        (floor(random() * 50000) + 1)::bigint,
        (floor(random() * 4) + 1)::int,
        round((random() * 190 + 10)::numeric, 2)
    FROM orders o
    CROSS JOIN LATERAL generate_series(1, (floor(random() * 3) + 1)::int) AS item_num;

    ANALYZE;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: pgcache-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pgcache-demo
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Logical replication is what PgCache uses for CDC-based invalidation.
          args:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "max_wal_senders=10"
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Keep the data + init dir out of the volume root to avoid the
            # lost+found clash on some CSI drivers.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "pgcache_demo"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "demo", "-d", "pgcache_demo"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pgcache-demo
  labels:
    app: postgres
spec:
  # NodePort so the origin DB is reachable from the host (consistency demo).
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30433