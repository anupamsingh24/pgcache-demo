apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-baseline
  namespace: pgcache-demo
  labels:
    app: app-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-baseline
  template:
    metadata:
      labels:
        app: app-baseline
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U demo; do
                echo "waiting for postgres..."; sleep 2;
              done
      containers:
        - name: app
          image: pgcache-demo-app:latest
          imagePullPolicy: IfNotPresent   # image is loaded into kind, not pulled
          env:
            - name: SPRING_APPLICATION_NAME
              value: app-baseline
            # Expose liveness/readiness probe groups under /actuator/health.
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/pgcache_demo
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-baseline
  namespace: pgcache-demo
  labels:
    app: app-baseline
spec:
  type: NodePort
  selector:
    app: app-baseline
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081