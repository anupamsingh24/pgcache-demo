global:
  scrape_interval: 5s

scrape_configs:
  - job_name: app-baseline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-baseline:8080"]

  - job_name: app-cached
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-cached:8080"]

  - job_name: pgcache
    metrics_path: /metrics
    static_configs:
      - targets: ["pgcache:9090"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
